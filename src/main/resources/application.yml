server:
  port: ${PORT:8081}
  tomcat:
    connection-timeout: ${TOMCAT_CONN_TIMEOUT:60000}
    keep-alive-timeout: ${TOMCAT_KEEPALIVE_TIMEOUT:60000}
  compression:
    enabled: ${COMPRESSION_ENABLED:true}
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: ${COMPRESSION_MIN_SIZE:1024}

spring:
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS:true}
  application:
    name: lead-enrichment-api
  mvc:
    async:
      request-timeout: ${ASYNC_TIMEOUT:60000}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lead_enrichment}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      connection-timeout: ${HIKARI_CONN_TIMEOUT:10000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:600000}
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:5000}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX:8}
          max-idle: ${REDIS_POOL_IDLE:4}
          min-idle: ${REDIS_POOL_MIN:1}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  jpa:
    open-in-view: true
    show-sql: false
    format-sql: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
  jackson:
    serialization:
      write-dates-as-timestamps: false

open-serp:
  api:
    url: ${OPENSERP_API_URL:http://localhost:7000}
  # Lista de endpoints OpenSERP com proxies rotativos.
  # Preencha para evitar bloqueio CAPTCHA do Google.
  # Se vazia, usa o api.url acima (comportamento padrão).
  endpoints:
    - url: ${OPENSERP_API_URL:http://localhost:7000}
    - url: ${OPENSERP_API_URL_2:}
    #   proxy: http://user:pass@proxy1:8080
    - url: ${OPENSERP_API_URL_3:}
    #   proxy: http://user:pass@proxy2:8080

api:
  key: ${API_KEY:dev-api-key}
  encryption:
    secret: ${ENCRYPTION_SECRET:change-me-16-bytes!}

# Timing filter desabilitado por padrão. Ative com app.timing-filter.enabled=true
app:
  timing-filter:
    enabled: ${TIMING_FILTER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
    enabled: ${TRACING_ENABLED:true}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      timeout: 5s

