server:
  port: ${PORT:8081}
  tomcat:
    connection-timeout: 60000
    keep-alive-timeout: 60000
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: lead-enrichment-api
  mvc:
    async:
      request-timeout: 60000
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 300000
      connection-timeout: 10000
      max-lifetime: 600000
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX:8}
          max-idle: ${REDIS_POOL_IDLE:4}
          min-idle: ${REDIS_POOL_MIN:1}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  jpa:
    open-in-view: true
    show-sql: false
    format-sql: false
    hibernate:
      ddl-auto: update
  jackson:
    serialization:
      write-dates-as-timestamps: false

open-serp:
  api:
    url: ${OPENSERP_API_URL:http://173.249.3.202:7000}
  # Lista de endpoints OpenSERP com proxies rotativos.
  # Preencha para evitar bloqueio CAPTCHA do Google.
  # Se vazia, usa o api.url acima (comportamento padrão).
  endpoints:
    - url: ${OPENSERP_API_URL:http://173.249.3.202:7000}
    - url: ${OPENSERP_API_URL_2:http://173.249.3.202:7002}
    #   proxy: http://user:pass@proxy1:8080
    - url: ${OPENSERP_API_URL_3:http://173.249.3.202:7003}
    #   proxy: http://user:pass@proxy2:8080

