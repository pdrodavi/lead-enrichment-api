version: '3.8'

services:
  # ===================== PostgreSQL =====================
  postgres:
    image: postgres:16
    container_name: postgres-${ENV:-dev}
    networks:
      - lead-net
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-pgsqldev}
      POSTGRES_DB: ${PG_DB:-postgres}
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===================== OpenSERP (Google Search API self-hosted) =====================
  openserp:
    image: karust/openserp:latest
    container_name: openserp-${ENV:-dev}
    restart: unless-stopped
    ports:
      - "7000:7000"
    command: serve -a 0.0.0.0 -p 7000
    networks:
      - lead-net

  # ===================== Lead Enrichment API =====================
  app:
    build:
      context: .
      args:
        DB_URL: ${DB_URL:-jdbc:postgresql://postgres-${ENV:-dev}:5432/postgres}
        DB_USERNAME: ${DB_USERNAME:-${PG_USER:-postgres}}
        DB_PASSWORD: ${DB_PASSWORD:-${PG_PASSWORD:-pgsqldev}}
        SERPER_API_URL: ${SERPER_API_URL:-http://openserp-${ENV:-dev}:7000}
        PORT: ${PORT:-8781}
    container_name: lead-enrichment-api-${ENV:-dev}
    ports:
      - "${PORT:-8781}:8081"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres-${ENV:-dev}:5432/postgres}
      DB_USERNAME: ${DB_USERNAME:-${PG_USER:-postgres}}
      DB_PASSWORD: ${DB_PASSWORD:-${PG_PASSWORD:-pgsqldev}}
      SERPER_API_URL: ${SERPER_API_URL:-http://openserp-${ENV:-dev}:7000}
      PORT: ${PORT:-8081}
    depends_on:
      postgres:
        condition: service_healthy
      openserp:
        condition: service_started
    restart: unless-stopped
    networks:
      - lead-net

volumes:
  postgres_data:

networks:
  lead-net:
    driver: bridge
    name: lead-enrichment-api-network